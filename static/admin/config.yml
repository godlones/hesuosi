# Decap CMS 配置

backend:
  name: github
  repo: godlones/hesuosi
  branch: main
  # 你的域名（Decap 用它在 /admin/ 完成 GitHub 登录回调）
  site_domain: whyhe.top
  # OAuth 代理地址（我们部署在 Cloudflare Pages Functions 上）
  base_url: https://whyhe.top
  # GitHub OAuth App 的 Client ID（已填入）
  application_id: Ov23li1lyopAAG2Xgy7Y

# 图片等媒体文件存放位置（Decap 上传后写入仓库，前台用 /media 引用）
media_folder: "content/media"
public_folder: "/media"

# 去掉下面这行可改为「保存即直接发布」；保留则是草稿→审核流程
publish_mode: editorial_workflow

collections:
  - name: "posts"
    label: "文章"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: "标题", widget: string }
      - { name: date, label: "日期", widget: datetime, format: "YYYY-MM-DD", required: false }
      - { name: category, label: "分类", widget: string, required: false }
      - { name: body, label: "正文", widget: markdown }
