<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}} · 何所思</title>
  <meta name="description" content="{{TITLE}}" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="progress" id="progress"></div>

  <header class="nav">
    <div class="brand"><span class="dot"></span>何所思</div>
    <nav class="nav-links">
      <a href="../#posts">文章</a>
      <a href="../#about">关于</a>
      <a href="../#subscribe">订阅</a>
      <a href="/admin/">后台</a>
    </nav>
  </header>

  <article class="post-full">
    <div class="post-head">
      <a class="back" href="../">← 返回首页</a>
      <div class="post-tags">
        <span class="tag">{{CATEGORY}}</span>
        <span class="post-date">{{DATE}}</span>
      </div>
      <h1 class="post-full-title">{{TITLE}}</h1>
    </div>

    <div class="post-content">
{{BODY}}
      <div class="post-foot">
        <p class="muted">本文来自「何所思」· {{DATE}} · 转载请注明出处</p>
      </div>
    </div>
  </article>

  <footer class="footer">
    <p>© <span class="yr"></span> 何所思 · Powered by Cloudflare Pages</p>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
